openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Farm Market API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: farmers
    description: Farmer profile operations
  - name: products
    description: Product listing operations
  - name: categories
    description: Category operations
  - name: orders
    description: Order operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /farmers:
    get:
      operationId: listFarmers
      tags: [farmers]
      summary: List all farmers
      responses:
        "200":
          description: List of farmers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Farmer"
    post:
      operationId: createFarmer
      tags: [farmers]
      summary: Create a farmer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"

  /farmers/{id}:
    get:
      operationId: getFarmer
      tags: [farmers]
      summary: Get a farmer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Farmer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"
        "404":
          description: Not found
    patch:
      operationId: updateFarmer
      tags: [farmers]
      summary: Update a farmer profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"
    delete:
      operationId: deleteFarmer
      tags: [farmers]
      summary: Delete a farmer profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: categoryId
          in: query
          schema:
            type: ["integer", "null"]
        - name: farmerId
          in: query
          schema:
            type: ["integer", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/featured:
    get:
      operationId: getFeaturedProducts
      tags: [products]
      summary: Get featured products (wow endpoint)
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/summary:
    get:
      operationId: getCategorySummary
      tags: [categories]
      summary: Get product counts per category (wow endpoint)
      responses:
        "200":
          description: Category summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategorySummary"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders
      parameters:
        - name: buyerEmail
          in: query
          required: false
          schema:
            type: string
          description: Filter orders by buyer email
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      description: |
        Requires an authenticated Clerk session and server-managed Clerk user
        publicMetadata. Administrators (role=admin) may update any order.
        Farmers (role=farmer with a positive integer farmerId) may update only
        non-empty orders whose products all belong to that farm. Mixed-farm
        orders require an administrator. Buyers and accounts without a valid
        grant are forbidden. Request-supplied roles and farm IDs are ignored.
      security:
        - ClerkSession: []
        - ClerkBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

        "400":
          description: Invalid order ID or status input
        "401":
          description: Missing or invalid Clerk authentication
        "403":
          description: Account unavailable, insufficient role, or order not exclusively assigned to the farmer
        "404":
          description: Order not found

  /market/stats:
    get:
      operationId: getMarketStats
      tags: [health]
      summary: Get market-wide stats (wow endpoint)
      responses:
        "200":
          description: Market statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketStats"

components:
  securitySchemes:
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk session cookie verified by the API
    ClerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session token verified by the API
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Farmer:
      type: object
      required: [id, name, location, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        bio:
          type: ["string", "null"]
        location:
          type: string
        imageUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    FarmerInput:
      type: object
      required: [name, location]
      properties:
        name:
          type: string
          minLength: 1
        bio:
          type: string
        location:
          type: string
          minLength: 1
        imageUrl:
          type: string

    FarmerUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        bio:
          type: string
        location:
          type: string
        imageUrl:
          type: string

    Category:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: ["string", "null"]

    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        icon:
          type: string

    CategorySummary:
      type: object
      required: [id, name, slug, productCount]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: ["string", "null"]
        productCount:
          type: integer

    Product:
      type: object
      required: [id, name, price, unit, farmerId, categoryId, createdAt, inStock]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        unit:
          type: string
        imageUrl:
          type: ["string", "null"]
        farmerId:
          type: integer
        farmerName:
          type: ["string", "null"]
        farmerLocation:
          type: ["string", "null"]
        categoryId:
          type: integer
        categoryName:
          type: ["string", "null"]
        inStock:
          type: boolean
        featured:
          type: boolean
        createdAt:
          type: string

    ProductInput:
      type: object
      required: [name, price, unit, farmerId, categoryId]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
        unit:
          type: string
          minLength: 1
        imageUrl:
          type: string
        farmerId:
          type: integer
        categoryId:
          type: integer
        inStock:
          type: boolean
        featured:
          type: boolean

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
        unit:
          type: string
        imageUrl:
          type: string
        categoryId:
          type: integer
        inStock:
          type: boolean
        featured:
          type: boolean

    OrderItem:
      type: object
      required: [productId, quantity, priceAtOrder]
      properties:
        productId:
          type: integer
        productName:
          type: ["string", "null"]
        quantity:
          type: number
        priceAtOrder:
          type: number
        unit:
          type: ["string", "null"]

    Order:
      type: object
      required: [id, buyerName, buyerEmail, status, totalAmount, createdAt, items]
      properties:
        id:
          type: integer
        buyerName:
          type: string
        buyerEmail:
          type: string
        status:
          type: string
        totalAmount:
          type: number
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    OrderInput:
      type: object
      required: [buyerName, buyerEmail, items]
      properties:
        buyerName:
          type: string
          minLength: 1
        buyerEmail:
          type: string
          minLength: 1
        notes:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"

    OrderItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
        quantity:
          type: number

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string

    MarketStats:
      type: object
      required: [totalFarmers, totalProducts, totalOrders, totalRevenue]
      properties:
        totalFarmers:
          type: integer
        totalProducts:
          type: integer
        totalOrders:
          type: integer
        totalRevenue:
          type: number

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
